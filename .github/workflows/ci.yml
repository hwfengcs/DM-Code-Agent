name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        # 钉精确版本而不是滚动标签 v9：setup-uv 只推到 v7 为止的滚动标签，
        # v8/v9 只有 vX.Y.Z 形式，写 @v9 会直接 "unable to resolve action"。
        # 钉死版本也与本项目 uv sync --frozen 的可复现精神一致。
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # uv.lock 必须与 pyproject.toml 保持同步：改了依赖却忘记重新 uv lock 时，
      # 这一步直接 fail，而不是让后续步骤装出一份与锁文件不符的依赖。
      - name: Verify lockfile is up to date
        run: uv lock --check

      # --frozen：严格按 uv.lock 安装，不做任何重解析。
      # 这是可复现构建的关键——任意两次 CI run 装到的依赖版本完全一致。
      - name: Install package from lockfile
        run: uv sync --frozen --extra dev

      - name: Compile Python sources
        run: uv run --frozen python -m compileall dm_agent main.py

      - name: Run tests
        run: uv run --frozen python -m pytest

      - name: Run deterministic eval smoke test
        run: uv run --frozen python -m dm_agent.evals.cli --variant full --task direct_finish

      - name: Run full deterministic eval suite with quality gate
        run: |
          uv run --frozen python -m dm_agent.evals.cli --output eval_reports/ci-report.json
          uv run --frozen python -m dm_agent.evals.gate eval_reports/ci-report.json --min-success-rate 1.0

      - name: Guard benchmark manifests against silent task drift
        run: |
          uv run --frozen python -m dm_agent.benchmarks.cli --suite coding --manifest-only eval_reports/ci-manifest-coding.json
          uv run --frozen python -m dm_agent.benchmarks.cli --suite maintenance --manifest-only eval_reports/ci-manifest-maintenance.json
          uv run --frozen python -m dm_agent.benchmarks.manifest_diff bench_reports/manifest-baseline-coding.json eval_reports/ci-manifest-coding.json
          uv run --frozen python -m dm_agent.benchmarks.manifest_diff bench_reports/manifest-baseline-maintenance.json eval_reports/ci-manifest-maintenance.json

      - name: List coding benchmark tasks
        run: uv run --frozen python -m dm_agent.benchmarks.cli --list

      - name: Lint
        run: uv run --frozen python -m ruff check .

      - name: Format check
        run: uv run --frozen python -m black --check .

      - name: Type check
        run: uv run --frozen python -m mypy dm_agent

  web:
    name: Web console frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci 严格按 package-lock.json 安装，与 Python 侧 uv sync --frozen 同理。
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Type check
        run: npm run typecheck
        working-directory: web

      - name: Run frontend tests
        run: npm run test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      # 前端产物入库（wheel 自带 UI，终端用户不需要 Node），所以必须防「改了源码
      # 忘了重新 build」——那会让 pip 装到的界面与仓库源码不一致，且没人会发现。
      # 上一步的构建输出就落在 dm_agent/server/static/，这里检查它是否与入库版本一致。
      - name: Verify committed build artifacts are up to date
        run: |
          if ! git diff --quiet -- dm_agent/server/static; then
            echo "::error::dm_agent/server/static 与 web/ 源码不一致。请在 web/ 下跑 npm run build 并提交产物。"
            git diff --stat -- dm_agent/server/static
            exit 1
          fi
          echo "前端产物与源码一致。"

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # uv.lock 必须与 pyproject.toml 保持同步：改了依赖却忘记重新 uv lock 时，
      # 这一步直接 fail，而不是让后续步骤装出一份与锁文件不符的依赖。
      - name: Verify lockfile is up to date
        run: uv lock --check

      # --frozen：严格按 uv.lock 安装，不做任何重解析。
      # 这是可复现构建的关键——任意两次 CI run 装到的依赖版本完全一致。
      - name: Install package from lockfile
        run: uv sync --frozen --extra dev

      - name: Compile Python sources
        run: uv run --frozen python -m compileall dm_agent main.py

      - name: Run tests
        run: uv run --frozen python -m pytest

      - name: Run deterministic eval smoke test
        run: uv run --frozen python -m dm_agent.evals.cli --variant full --task direct_finish

      - name: Run full deterministic eval suite with quality gate
        run: |
          uv run --frozen python -m dm_agent.evals.cli --output eval_reports/ci-report.json
          uv run --frozen python -m dm_agent.evals.gate eval_reports/ci-report.json --min-success-rate 1.0

      - name: Guard benchmark manifests against silent task drift
        run: |
          uv run --frozen python -m dm_agent.benchmarks.cli --suite coding --manifest-only eval_reports/ci-manifest-coding.json
          uv run --frozen python -m dm_agent.benchmarks.cli --suite maintenance --manifest-only eval_reports/ci-manifest-maintenance.json
          uv run --frozen python -m dm_agent.benchmarks.manifest_diff bench_reports/manifest-baseline-coding.json eval_reports/ci-manifest-coding.json
          uv run --frozen python -m dm_agent.benchmarks.manifest_diff bench_reports/manifest-baseline-maintenance.json eval_reports/ci-manifest-maintenance.json

      - name: List coding benchmark tasks
        run: uv run --frozen python -m dm_agent.benchmarks.cli --list

      - name: Lint
        run: uv run --frozen python -m ruff check .

      - name: Format check
        run: uv run --frozen python -m black --check .

      - name: Type check
        run: uv run --frozen python -m mypy dm_agent
